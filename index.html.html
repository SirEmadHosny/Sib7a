<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السبحة الإلكترونية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
    }

    /* تخصيص شريط التمرير */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 121, 107, 0.4); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 121, 107, 0.7); }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      color: #333;
      margin: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* منع السكرول تماما */
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.5s ease;
    }

    body.dark-mode {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f8f8f8;
    }

    /* الحاوية الرئيسية لتوزيع العناصر على الشاشة */
    .desktop-layout {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
      width: 1300px;
      height: 700px;
      gap: 40px;
      padding: 30px;
    }

    /* --- قسم العدادات (الجانب الأيمن) --- */
    .side-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .counters-box {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .dark-mode .counters-box { 
      background: rgba(0, 0, 0, 0.3); 
      border-color: rgba(255, 255, 255, 0.05); 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); 
    }

    .counters-container { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 15px; 
    }

    .counter-item {
      padding: 15px 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: rgba(255, 255, 255, 0.7);
      transition: transform 0.2s ease, background 0.3s;
    }
    .counter-item:hover { transform: translateY(-3px); }

    .dark-mode .counter-item { 
      background: rgba(255, 255, 255, 0.05); 
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
    }

    .counter-item .label { font-size: 16px; font-weight: bold; color: #555; cursor: pointer; }
    .dark-mode .counter-item .label { color: #ddd; }
    
    .counter-item .value { font-size: 24px; font-weight: bold; color: #00796b; background: rgba(0,121,107,0.1); padding: 5px 15px; border-radius: 8px; }
    .dark-mode .counter-item .value { color: #48c9b0; background: rgba(72, 201, 176, 0.1); }
    
    #session-counter-istighfar-item, #daily-counter-istighfar-item, #total-counter-istighfar-item { display: none; }

    /* --- قسم السبحة (الجانب الأيسر) --- */
    .main-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      position: relative;
    }
    .dark-mode .main-panel {
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    /* --- حاوية الذكر --- */
    .dropdown {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

.dhikr-container {
  background: rgba(255, 255, 255, 0.8);
  border: 2px solid transparent;
  border-radius: 15px;
  padding: 15px 25px;
  font-family: 'Amiri', serif;
  color: #00796b;
  cursor: pointer;
  box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.08);
  margin-bottom: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 120px;
  overflow: hidden;
  transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}
.dark-mode .dhikr-container {
  background: rgba(30, 30, 30, 0.8);
  color: #48c9b0;
  box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
}
.dark-mode .dhikr-container:hover {
  border-color: rgba(72, 201, 176, 0.3);
}
.dhikr-container:hover {
  transform: translateY(-2px);
  box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.12);
  border-color: rgba(0, 121, 107, 0.3);
}

    .dhikr-name { text-align: center; font-weight: bold; }

    /* --- الدائرة (زر التسبيح) --- */
    .counter-circle {
      width: 200px; 
      height: 200px; 
      background: linear-gradient(145deg, #00897b, #00695c);
      border-radius: 50%;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 3em;
      box-shadow: 0 15px 35px rgba(0, 121, 107, 0.4), inset 0 5px 15px rgba(255,255,255,0.2); 
      color: white; 
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
      margin-bottom: 40px;
    }
    .counter-circle:hover { transform: scale(1.03); box-shadow: 0 20px 40px rgba(0, 121, 107, 0.5), inset 0 5px 15px rgba(255,255,255,0.3); }
    .counter-circle:active { transform: scale(0.92); box-shadow: 0 10px 20px rgba(0, 121, 107, 0.3), inset 0 2px 5px rgba(0,0,0,0.2); }
    
    .dark-mode .counter-circle { 
      background: linear-gradient(145deg, #2c3e50, #1a252f); 
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 5px 15px rgba(255,255,255,0.05); 
      color: #48c9b0; 
    }
    .dark-mode .counter-circle:hover { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 5px 15px rgba(255,255,255,0.1); }

    /* --- القائمة المنسدلة --- */
    .dropdown-content {
      display: none; 
      position: absolute; 
      top: 110px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.15); 
      z-index: 1000; 
      border-radius: 15px;
      max-height: 350px; 
      overflow-y: auto;
      border: 1px solid rgba(0,0,0,0.05); 
      animation: fadeInDown 0.3s ease;
    }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    
    .dark-mode .dropdown-content { background: rgba(30, 30, 30, 0.95); border-color: rgba(255,255,255,0.05); box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.5); }
    
    .dropdown-content div.dhikr-item, .dropdown-content div.add-new {
      padding: 15px 20px; 
      cursor: pointer;
      font-size: 1.2em; 
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      transition: background 0.2s;
    }
    .dropdown-content div.dhikr-item:hover, .dropdown-content div.add-new:hover { background: rgba(0, 121, 107, 0.05); }
    .dark-mode .dropdown-content div.dhikr-item, .dark-mode .dropdown-content div.add-new { border-color: rgba(255,255,255,0.05); }
    .dark-mode .dropdown-content div.dhikr-item:hover, .dark-mode .dropdown-content div.add-new:hover { background: rgba(255,255,255,0.05); }

    .dhikr-item { display: flex; justify-content: space-between; align-items: center; }
    .dhikr-item-text { font-family: 'Amiri', serif; font-size: 1.2em; flex-grow: 1; }
    
    .dhikr-item .actions { display: flex; gap: 15px; align-items: center; }
    .dhikr-item i { color: #888; transition: color 0.3s; }
    .dhikr-item i:hover { color: #00796b; transform: scale(1.1); }
    .dark-mode .dhikr-item i:hover { color: #48c9b0; }

    .counter-controls span {
      background: #f0f0f0; padding: 4px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .dark-mode .counter-controls span { background: #444; color: #fff; }

    .dhikr-dot { height: 16px; width: 16px; background-color: #ccc; border-radius: 50%; display: inline-block; cursor: pointer; }
    .dhikr-dot.active-dot { background-color: #2ecc71; box-shadow: 0 0 8px rgba(46, 204, 113, 0.5); }
    
    .dhikr-exclude-icon { font-size: 1.1em; color: #ccc; cursor: pointer; }
    .dhikr-exclude-icon.excluded { color: #e74c3c; }

    /* --- الأزرار السفلية --- */
    .bottom-buttons { 
      display: flex; 
      justify-content: center; 
      gap: 30px; 
      width: 100%; 
    }
    
    .bottom-buttons button, .bottom-buttons .icon-button { 
      background: rgba(255, 255, 255, 0.6); 
      color: #555; 
      border: none; 
      border-radius: 50%; 
      cursor: pointer; 
      width: 65px; 
      height: 65px; 
      font-size: 1.6em;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    .bottom-buttons button:hover, .bottom-buttons .icon-button:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(0,0,0,0.15); background: #fff; color: #00796b; }
    
    .dark-mode .bottom-buttons button, .dark-mode .bottom-buttons .icon-button { 
      background: rgba(0, 0, 0, 0.4); 
      color: #aaa; 
      box-shadow: 0 8px 15px rgba(0,0,0,0.3); 
    }
    .dark-mode .bottom-buttons button:hover, .dark-mode .bottom-buttons .icon-button:hover { background: rgba(0,0,0,0.6); color: #48c9b0; }

    #pin-dhikr.pinned { color: #00796b; background: rgba(0,121,107,0.1); }
    .dark-mode #pin-dhikr.pinned { color: #48c9b0; background: rgba(72,201,176,0.1); }
    #random-dhikr-button.active > i { color: #00796b; }
    .dark-mode #random-dhikr-button.active > i { color: #48c9b0; }
  </style>
</head>
<body id="body">

  <div class="desktop-layout">
    
    <div class="side-panel">
      <div class="counters-box" id="counters-box">
        <div class="counters-container">
          <div class="counter-item" id="session-counter-item">
            <span class="label">جلسة التسبيح</span>
            <span id="session-counter" class="value">0</span>
          </div>
          <div class="counter-item" id="daily-counter-item">
            <span class="label" id="daily-counter-label">تسبيح اليوم</span>
            <span id="daily-counter" class="value">0</span>
          </div>
          <div class="counter-item" id="total-counter-item">
            <span class="label">إجمالي التسبيح</span>
            <span id="total-counter" class="value">0</span>
          </div>
          <div class="counter-item" id="session-counter-istighfar-item">
            <span class="label">جلسة الاستغفار</span>
            <span id="session-counter-istighfar-value" class="value">0</span>
          </div>
          <div class="counter-item" id="daily-counter-istighfar-item">
            <span class="label" id="daily-counter-istighfar-label">استغفار اليوم</span>
            <span id="daily-counter-istighfar" class="value">0</span>
          </div>
          <div class="counter-item" id="total-counter-istighfar-item">
            <span class="label">إجمالي الاستغفار</span>
            <span id="total-counter-istighfar-value" class="value">0</span>
          </div>
        </div>
      </div>
    </div>

    <div class="main-panel">
      <div class="dropdown">
        <div class="dhikr-container" id="dhikr-container">
          <div class="dhikr-name" id="dhikr-name">سبحان الله</div>
        </div>
        <div class="dropdown-content" id="dhikr-list"></div>
      </div>
      
      <div class="counter-circle" id="counter-circle">0</div>
      
      <div class="bottom-buttons">
        <i id="pin-dhikr" class="fas fa-thumbtack icon-button" title="تثبيت/إلغاء تثبيت الذكر الحالي"></i>
        <button id="dark-mode-toggle" title="تبديل الوضع الداكن/الفاتح">
          <i class="fas fa-moon"></i>
        </button>
        <button id="random-dhikr-button" title="اختيار ذكر عشوائي">
          <i class="fas fa-random"></i>
        </button>
      </div>
    </div>

  </div>

  <script>
    // نفس كود الجافاسكربت الخاص بك بدون أي تعديل نهائياً للحفاظ على البرمجة
    let initialDhikrList = JSON.parse(localStorage.getItem('dhikrOrder')) || [ 'سبحان الله', 'سبحان الله وبحمده', 'سبحان الله العظيم وبحمده', 'سبحان الله وبحمده سبحان الله العظيم', 'سبوح قدوس رب الملائكة والروح', 'الله اكبر', 'الحمدلله', 'لا اله الا الله', 'لا حول ولا قوة الا بالله', 'لا اله الا الله وحده لا شريك له له الملك وله الحمد وهو على كل شئ قدير', 'اللهم صل وسلم على سيدنا محمد', 'الإســتــغـفـــــــــــار' ];

    function initializeDhikrSettings(key, defaultValue) {
        let storedData = JSON.parse(localStorage.getItem(key)) || {};
        let newData = {};
        initialDhikrList.forEach(dhikr => {
            newData[dhikr] = storedData.hasOwnProperty(dhikr) ? storedData[dhikr] : defaultValue;
        });
        return newData;
    }

    let dhikrAutoSwitchCounts = initializeDhikrSettings('dhikrAutoSwitchCounts', 3);
    let dhikrDotStates = initializeDhikrSettings('dhikrDotStates', false);
    let dhikrExcludedStates = initializeDhikrSettings('dhikrExcludedStates', false);

    let currentDhikr = localStorage.getItem('currentDhikr');
    if (!currentDhikr || !initialDhikrList.includes(currentDhikr)) {
        currentDhikr = initialDhikrList.find(d => d !== 'الإســتــغـفـــــــــــار') || initialDhikrList[0] || '';
    }

    let lastTasbeehDhikr = localStorage.getItem('lastTasbeehDhikr');

    let dropdownOpen = false;
    let disableAutoSwitch = currentDhikr === 'الإســتــغـفـــــــــــار';
    let isAutoSwitchPinned = localStorage.getItem('isAutoSwitchPinned') === 'true';
    let isRandomModeActive = localStorage.getItem('isRandomModeActive') === 'true' || false;
    let isDarkMode = localStorage.getItem('isDarkMode') === 'true';
    let remainingClicks = parseInt(localStorage.getItem('remainingClicks')) || (dhikrAutoSwitchCounts[currentDhikr] || 3);
    
    let longPressTimer;
    let longPressActive = false;

    let dhikrSessionCounts = {}; 

    let dailyCounter = parseInt(localStorage.getItem('dailyCounter')) || 0;
    let totalDhikrCounter = parseInt(localStorage.getItem('totalDhikrCounter')) || 0;
    let previousSessionCounter;

    let dailyCounterIstighfar = parseInt(localStorage.getItem('dailyCounterIstighfar')) || 0;
    let totalIstighfarCounter = parseInt(localStorage.getItem('totalIstighfarCounter')) || 0;
    let previousIstighfarSessionCounter;

    const body = document.getElementById('body');
    const dhikrListElement = document.getElementById('dhikr-list');
    const counterCircleElement = document.getElementById('counter-circle');
    const dhikrNameElement = document.getElementById('dhikr-name');
    const dhikrContainerElement = document.getElementById('dhikr-container');
    const dailyCounterElement = document.getElementById('daily-counter');
    const dailyCounterLabelElement = document.getElementById('daily-counter-label');
    const sessionCounterElement = document.getElementById('session-counter');
    const totalCounterElement = document.getElementById('total-counter');
    const sessionCounterIstighfarElement = document.getElementById('session-counter-istighfar-value');
    const totalCounterIstighfarElement = document.getElementById('total-counter-istighfar-value');
    const dailyCounterIstighfarElement = document.getElementById('daily-counter-istighfar');
    const dailyCounterIstighfarLabelElement = document.getElementById('daily-counter-istighfar-label');
    const pinDhikrButton = document.getElementById('pin-dhikr');
    const countersBoxElement = document.getElementById('counters-box');
    const randomDhikrButton = document.getElementById('random-dhikr-button');
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const sessionCounterItem = document.getElementById('session-counter-item');
    const dailyCounterItem = document.getElementById('daily-counter-item');
    const totalCounterItem = document.getElementById('total-counter-item');
    const sessionCounterIstighfarItem = document.getElementById('session-counter-istighfar-item');
    const dailyCounterIstighfarItem = document.getElementById('daily-counter-istighfar-item');
    const totalCounterIstighfarItem = document.getElementById('total-counter-istighfar-item');

    document.addEventListener('DOMContentLoaded', () => {
        let lastSessionCounts = JSON.parse(localStorage.getItem('dhikrSessionCounts')) || {};
        let totalTasbeehLastSession = 0;
        let totalIstighfarLastSession = 0;

        for (const dhikr in lastSessionCounts) {
            const count = lastSessionCounts[dhikr] || 0;
            if (dhikr === 'الإســتــغـفـــــــــــار') {
                totalIstighfarLastSession += count;
            } else {
                totalTasbeehLastSession += count;
            }
        }
        
        if (Object.keys(lastSessionCounts).length > 0) {
             localStorage.setItem('previousSessionCounter', totalTasbeehLastSession.toString());
             localStorage.setItem('previousIstighfarSessionCounter', totalIstighfarLastSession.toString());
        }
        
        localStorage.removeItem('dhikrSessionCounts');

        if (isDarkMode) { body.classList.add('dark-mode'); updateDarkModeIcon(); }
        
        if (!initialDhikrList.includes('الإســتــغـفـــــــــــار')) {
            initialDhikrList.push('الإســتــغـفـــــــــــار');
        }
        
        previousSessionCounter = parseInt(localStorage.getItem('previousSessionCounter')) || 0;
        previousIstighfarSessionCounter = parseInt(localStorage.getItem('previousIstighfarSessionCounter')) || 0;
        
        updateAllUI();
        
        darkModeToggle.addEventListener('click', toggleDarkMode);
        randomDhikrButton.addEventListener('click', toggleRandomMode);
        pinDhikrButton.addEventListener('click', togglePinDhikr);
        dhikrContainerElement.addEventListener('click', toggleDropdown);

        counterCircleElement.addEventListener('mousedown', startPress);
        counterCircleElement.addEventListener('touchstart', startPress, { passive: false });
        counterCircleElement.addEventListener('mouseup', endPress);
        counterCircleElement.addEventListener('touchend', endPress);
        counterCircleElement.addEventListener('mouseleave', cancelPress);
        
        dailyCounterLabelElement.addEventListener('click', resetDailyCounter);
        dailyCounterIstighfarLabelElement.addEventListener('click', resetDailyIstighfarCounter);
        totalCounterElement.addEventListener('click', editTotalCounter);
        totalCounterIstighfarElement.addEventListener('click', editTotalIstighfarCounter);

        document.addEventListener('click', (event) => {
            if (dropdownOpen && !dhikrContainerElement.contains(event.target) && !dhikrListElement.contains(event.target)) {
                closeDropdown();
            }
        });
    });

    function startPress(e) {
        e.preventDefault();
        longPressActive = false;
        longPressTimer = setTimeout(() => {
            longPressActive = true;
            
            if (currentDhikr === 'الإســتــغـفـــــــــــار') {
                let dhikrToReturnTo = lastTasbeehDhikr;
                if (!dhikrToReturnTo || !initialDhikrList.includes(dhikrToReturnTo)) {
                    dhikrToReturnTo = initialDhikrList.find(d => d !== 'الإســتــغـفـــــــــــار') || initialDhikrList[0] || '';
                }
                selectDhikr(dhikrToReturnTo);

            } else {
                lastTasbeehDhikr = currentDhikr;
                selectDhikr('الإســتــغـفـــــــــــار');
            }

            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }, 2000);
    }

    function endPress(e) {
        e.preventDefault();
        clearTimeout(longPressTimer);
        if (!longPressActive) {
            incrementCounter();
        }
    }

    function cancelPress() {
        clearTimeout(longPressTimer);
    }

    function incrementCounter() {
        if (!currentDhikr) return;

        dhikrSessionCounts[currentDhikr] = (dhikrSessionCounts[currentDhikr] || 0) + 1;
        
        let switched = false;
        if (currentDhikr === 'الإســتــغـفـــــــــــار') {
            dailyCounterIstighfar++;
            totalIstighfarCounter++;
        } else {
            dailyCounter++;
            totalDhikrCounter++;

            if (!isAutoSwitchPinned && !isRandomModeActive) {
                remainingClicks--;
                if (remainingClicks <= 0) {
                    moveToNextDhikr();
                    switched = true;
                }
            } else if (isRandomModeActive) {
                remainingClicks--;
                if (remainingClicks <= 0) {
                    selectRandomDhikrAndClicks();
                    switched = true;
                }
            }
        }
        updateCountersText();
        if(switched) { updateDhikrName(); }
        saveDataToStorage(); 
    }

    function decrementCounter() {
        if (!currentDhikr) return;

        if (dhikrSessionCounts[currentDhikr] && dhikrSessionCounts[currentDhikr] > 0) {
            dhikrSessionCounts[currentDhikr]--;
            if (currentDhikr === 'الإســتــغـفـــــــــــار') {
                if (dailyCounterIstighfar > 0) dailyCounterIstighfar--;
                if (totalIstighfarCounter > 0) totalIstighfarCounter--;
            } else {
                if (dailyCounter > 0) dailyCounter--;
                if (totalDhikrCounter > 0) totalDhikrCounter--;
            }
        }
        updateCountersText();
        saveDataToStorage();
    }

    function saveDataToStorage() {
        localStorage.setItem('dailyCounter', dailyCounter.toString());
        localStorage.setItem('totalDhikrCounter', totalDhikrCounter.toString());
        localStorage.setItem('dailyCounterIstighfar', dailyCounterIstighfar.toString());
        localStorage.setItem('totalIstighfarCounter', totalIstighfarCounter.toString());
        localStorage.setItem('currentDhikr', currentDhikr);
        localStorage.setItem('lastTasbeehDhikr', lastTasbeehDhikr);
        localStorage.setItem('remainingClicks', remainingClicks.toString());
        localStorage.setItem('isAutoSwitchPinned', isAutoSwitchPinned.toString());
        localStorage.setItem('isRandomModeActive', isRandomModeActive.toString());
        localStorage.setItem('isDarkMode', isDarkMode.toString());
        localStorage.setItem('dhikrOrder', JSON.stringify(initialDhikrList));
        localStorage.setItem('dhikrAutoSwitchCounts', JSON.stringify(dhikrAutoSwitchCounts));
        localStorage.setItem('dhikrDotStates', JSON.stringify(dhikrDotStates));
        localStorage.setItem('dhikrExcludedStates', JSON.stringify(dhikrExcludedStates));
        localStorage.setItem('dhikrSessionCounts', JSON.stringify(dhikrSessionCounts));
    }
    
    function selectDhikr(dhikr) {
        if (!dhikr || !initialDhikrList.includes(dhikr) || dhikr === currentDhikr) return;
        
        currentDhikr = dhikr;
        remainingClicks = dhikrAutoSwitchCounts[currentDhikr] || 3;
        disableAutoSwitch = currentDhikr === 'الإســتــغـفـــــــــــار';
        
        updateAllUI();
        closeDropdown();
        saveDataToStorage();
    }

    function moveToNextDhikr() {
        const dhikrKeys = initialDhikrList.filter(d => d !== 'الإســتــغـفـــــــــــار');
        if (dhikrKeys.length === 0) return;
        let filtered = dhikrKeys.filter(d => dhikrDotStates[d] && !dhikrExcludedStates[d]);
        if (filtered.length === 0) filtered = dhikrKeys.filter(d => !dhikrExcludedStates[d]);
        if (filtered.length === 0) filtered = dhikrKeys;
        
        const currentIndex = filtered.indexOf(currentDhikr);
        const nextIndex = (currentIndex + 1) % filtered.length;
        selectDhikr(filtered[nextIndex]);
    }
    
    function updateAllUI() {
        updateCountersText();
        updateCountersVisibility();
        updatePinButtonUI();
        updateRandomButtonUI();
        updateDhikrName();
    }

    function updateCountersText() {
        let displayCounter = 0;

        if (currentDhikr === 'الإســتــغـفـــــــــــار') {
            displayCounter = dhikrSessionCounts['الإســتــغـفـــــــــــار'] || 0;
        } else {
            for (const dhikr in dhikrSessionCounts) {
                if (dhikr !== 'الإســتــغـفـــــــــــار') {
                    displayCounter += dhikrSessionCounts[dhikr] || 0;
                }
            }
        }

        counterCircleElement.innerText = displayCounter;

        sessionCounterElement.innerText = previousSessionCounter;
        sessionCounterIstighfarElement.innerText = previousIstighfarSessionCounter;
        dailyCounterElement.innerText = dailyCounter;
        totalCounterElement.innerText = totalDhikrCounter;
        dailyCounterIstighfarElement.innerText = dailyCounterIstighfar;
        totalCounterIstighfarElement.innerText = totalIstighfarCounter;
    }
    
function updateDhikrName() {
    if (currentDhikr && currentDhikr.length > 35) {
        dhikrContainerElement.style.fontSize = '1.3em'
    } else {
        dhikrContainerElement.style.fontSize = '2.2em'
    }
    dhikrNameElement.innerText = currentDhikr || 'اختر ذكرا'
}
    function updateCountersVisibility() {
        const isIstighfar = currentDhikr === 'الإســتــغـفـــــــــــار';
        const hasOtherDhikr = initialDhikrList.some(d => d !== 'الإســتــغـفـــــــــــار');
        const showRegular = !isIstighfar && hasOtherDhikr;
        
        sessionCounterItem.style.display = showRegular ? 'flex' : 'none';
        dailyCounterItem.style.display = showRegular ? 'flex' : 'none';
        totalCounterItem.style.display = showRegular ? 'flex' : 'none';
        pinDhikrButton.style.visibility = showRegular ? 'visible' : 'hidden';
        randomDhikrButton.style.visibility = showRegular ? 'visible' : 'hidden';
        
        sessionCounterIstighfarItem.style.display = isIstighfar ? 'flex' : 'none';
        dailyCounterIstighfarItem.style.display = isIstighfar ? 'flex' : 'none';
        totalCounterIstighfarItem.style.display = isIstighfar ? 'flex' : 'none';
        
        countersBoxElement.style.display = (hasOtherDhikr || isIstighfar) ? 'flex' : 'none';
    }

    function toggleDropdown() {
        dropdownOpen = !dropdownOpen;
        if (dropdownOpen) {
            updateDropdownList();
            dhikrListElement.style.display = 'block';
        } else {
            dhikrListElement.style.display = 'none';
        }
    }
    
    function closeDropdown() {
        dropdownOpen = false;
        dhikrListElement.style.display = 'none';
    }

    function updateDropdownList() {
        dhikrListElement.innerHTML = '';
        initialDhikrList.forEach(dhikr => {
            if (dhikr === 'الإســتــغـفـــــــــــار') return;

            const dhikrItem = document.createElement('div');
            dhikrItem.className = 'dhikr-item';

            const textSpan = document.createElement('span');
            textSpan.className = 'dhikr-item-text';
            textSpan.textContent = dhikr;
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'actions';
            
            actionsDiv.innerHTML = `
                <i class="fas fa-edit" title="تعديل الاسم" onclick="editDhikr(event, '${dhikr}')"></i>
                <i class="fas fa-trash-alt" title="حذف الذكر" onclick="deleteDhikr(event, '${dhikr}')"></i>
                <div class="counter-controls" title="تعديل عدد التكرارات للتبديل التلقائي">
                    <span onclick="editAutoSwitchCount(event, '${dhikr}')">${dhikrAutoSwitchCounts[dhikr] || 3}</span>
                </div>
                <span class="dhikr-dot ${dhikrDotStates[dhikr] ? 'active-dot' : ''}" title="تضمين في التبديل" onclick="toggleDhikrDot(event, '${dhikr}')"></span>
                <i class="fas fa-times dhikr-exclude-icon ${dhikrExcludedStates[dhikr] ? 'excluded' : ''}" title="استبعاد من التبديل" onclick="toggleDhikrExclude(event, '${dhikr}')"></i>
            `;
            
            dhikrItem.appendChild(textSpan);
            dhikrItem.appendChild(actionsDiv);
            
            dhikrItem.addEventListener('click', (e) => {
                if (e.target.closest('.actions')) return;
                selectDhikr(dhikr);
            });
            dhikrListElement.appendChild(dhikrItem);
        });

        const addNewButton = document.createElement('div');
        addNewButton.textContent = 'إضافة ذكر جديد +';
        addNewButton.className = 'add-new';
        addNewButton.style.textAlign = 'center';
        addNewButton.style.fontWeight = 'bold';
        addNewButton.onclick = addNewDhikr;
        dhikrListElement.appendChild(addNewButton);
    }
    
    function editDhikr(event, oldDhikr) {
        event.stopPropagation();
        const newDhikr = prompt('تعديل الذكر:', oldDhikr);
        if (newDhikr && newDhikr.trim() && newDhikr !== oldDhikr) {
            const trimmedNew = newDhikr.trim();
            if (initialDhikrList.includes(trimmedNew)) { alert('هذا الذكر موجود بالفعل!'); return; }
            
            dhikrAutoSwitchCounts[trimmedNew] = dhikrAutoSwitchCounts[oldDhikr];
            dhikrDotStates[trimmedNew] = dhikrDotStates[oldDhikr];
            dhikrExcludedStates[trimmedNew] = dhikrExcludedStates[oldDhikr];
            if(dhikrSessionCounts[oldDhikr]) {
                dhikrSessionCounts[trimmedNew] = dhikrSessionCounts[oldDhikr];
                delete dhikrSessionCounts[oldDhikr];
            }

            delete dhikrAutoSwitchCounts[oldDhikr];
            delete dhikrDotStates[oldDhikr];
            delete dhikrExcludedStates[oldDhikr];

            const index = initialDhikrList.indexOf(oldDhikr);
            if (index > -1) initialDhikrList[index] = trimmedNew;
            if (currentDhikr === oldDhikr) { 
                currentDhikr = trimmedNew;
                updateAllUI();
            }
            
            updateDropdownList();
            saveDataToStorage();
        }
    }

    function deleteDhikr(event, dhikr) {
        event.stopPropagation();
        if (confirm(`هل أنت متأكد أنك تريد حذف "${dhikr}"؟`)) {
            delete dhikrAutoSwitchCounts[dhikr];
            delete dhikrDotStates[dhikr];
            delete dhikrExcludedStates[dhikr];
            delete dhikrSessionCounts[dhikr];
            
            const index = initialDhikrList.indexOf(dhikr);
            if (index > -1) initialDhikrList.splice(index, 1);
            
            if (currentDhikr === dhikr) {
                const nextDhikr = initialDhikrList.find(d => d !== 'الإســتــغـفـــــــــــار') || initialDhikrList[0] || '';
                selectDhikr(nextDhikr);
            }
            
            updateDropdownList();
            updateCountersVisibility();
            updateCountersText();
            saveDataToStorage();
        }
    }

    function addNewDhikr(event) {
        event.stopPropagation();
        const newDhikr = prompt('أدخل الذكر الجديد:');
        const trimmedNew = newDhikr ? newDhikr.trim() : null;
        if (trimmedNew) {
            if (initialDhikrList.includes(trimmedNew)) { alert('هذا الذكر موجود بالفعل!'); return; }
            dhikrAutoSwitchCounts[trimmedNew] = 33;
            dhikrDotStates[trimmedNew] = false;
            dhikrExcludedStates[trimmedNew] = false;

            const istighfarIndex = initialDhikrList.indexOf('الإســتــغـفـــــــــــار');
            if (istighfarIndex > -1) {
                initialDhikrList.splice(istighfarIndex, 0, trimmedNew);
            } else {
                initialDhikrList.push(trimmedNew);
            }
            updateDropdownList();
            updateCountersVisibility();
            saveDataToStorage();
        }
    }
    
    function resetDailyCounter() { if(confirm('هل تريد تصفير عداد اليوم؟')){ dailyCounter = 0; updateCountersText(); saveDataToStorage(); }}
    function resetDailyIstighfarCounter() { if(confirm('هل تريد تصفير عداد الاستغفار اليومي؟')){ dailyCounterIstighfar = 0; updateCountersText(); saveDataToStorage(); }}
    
    function editTotalCounter() {
        const input = prompt('تعديل إجمالي الأذكار (باستثناء الاستغفار):', totalDhikrCounter);
        const newTotal = parseInt(input);
        if (!isNaN(newTotal) && newTotal >= 0) {
            totalDhikrCounter = newTotal;
            dailyCounter = 0; 
            updateCountersText();
            saveDataToStorage();
        }
    }
    
    function editTotalIstighfarCounter() {
        if (confirm('هل تريد تصفير كل عدادات الاستغفار (اليوم، الإجمالي)؟')) {
            dailyCounterIstighfar = 0;
            totalIstighfarCounter = 0;
            dhikrSessionCounts['الإســتــغـفـــــــــــار'] = 0;
        } else {
            const input = prompt('تعديل إجمالي الاستغفار:', totalIstighfarCounter);
            const newTotal = parseInt(input);
            if (!isNaN(newTotal) && newTotal >= 0) {
                totalIstighfarCounter = newTotal;
                dailyCounterIstighfar = 0; 
            }
        }
        updateCountersText();
        saveDataToStorage();
    }

    function editAutoSwitchCount(event, dhikr) { event.stopPropagation(); const currentVal = dhikrAutoSwitchCounts[dhikr] || 3; const input = prompt(`أدخل العدد الجديد لـ "${dhikr}":`, currentVal); const newCount = parseInt(input); if(!isNaN(newCount) && newCount > 0){ dhikrAutoSwitchCounts[dhikr] = newCount; if(dhikr === currentDhikr){ remainingClicks = newCount; } updateDropdownList(); saveDataToStorage(); } else if (input !== null) { alert('إدخال غير صالح.'); } }
    function toggleDhikrDot(event, dhikr) { event.stopPropagation(); dhikrDotStates[dhikr] = !dhikrDotStates[dhikr]; if(dhikrDotStates[dhikr]){ dhikrExcludedStates[dhikr] = false; } updateDropdownList(); saveDataToStorage(); }
    function toggleDhikrExclude(event, dhikr) { event.stopPropagation(); dhikrExcludedStates[dhikr] = !dhikrExcludedStates[dhikr]; if(dhikrExcludedStates[dhikr]){ dhikrDotStates[dhikr] = false; } updateDropdownList(); saveDataToStorage(); }
    function togglePinDhikr(event) { event.stopPropagation(); if (currentDhikr === 'الإســتــغـفـــــــــــار') return; isAutoSwitchPinned = !isAutoSwitchPinned; if (isAutoSwitchPinned) { isRandomModeActive = false; } updatePinButtonUI(); updateRandomButtonUI(); saveDataToStorage(); }
    function updatePinButtonUI() { pinDhikrButton.classList.toggle('pinned', isAutoSwitchPinned); pinDhikrButton.title = isAutoSwitchPinned ? 'إلغاء تثبيت الذكر' : 'تثبيت الذكر (إيقاف التبديل)'; }
    function toggleRandomMode(event) { event.stopPropagation(); if (currentDhikr === 'الإســتــغـفـــــــــــار') return; isRandomModeActive = !isRandomModeActive; if (isRandomModeActive) { isAutoSwitchPinned = false; } updateRandomButtonUI(); updatePinButtonUI(); saveDataToStorage(); }
    function updateRandomButtonUI() { const hasOtherDhikr = initialDhikrList.some(d => d !== 'الإســتــغـفـــــــــــار'); randomDhikrButton.classList.toggle('active', isRandomModeActive); randomDhikrButton.title = isRandomModeActive ? 'إيقاف الوضع العشوائي' : 'تفعيل الوضع العشوائي'; randomDhikrButton.disabled = !hasOtherDhikr; randomDhikrButton.style.opacity = hasOtherDhikr ? 1 : 0.5; }
    function selectRandomDhikrAndClicks() {
        const dhikrKeys = initialDhikrList.filter(d => d !== 'الإســتــغـفـــــــــــار'); if (dhikrKeys.length === 0) { isRandomModeActive = false; updateRandomButtonUI(); return; }
        let available = dhikrKeys.filter(d => dhikrDotStates[d] && !dhikrExcludedStates[d]); if (available.length === 0) available = dhikrKeys.filter(d => !dhikrExcludedStates[d]); if (available.length === 0) available = dhikrKeys;
        let nextDhikr; if (available.length <= 1) { nextDhikr = available[0]; } else { const possible = available.filter(d => d !== currentDhikr); nextDhikr = possible[Math.floor(Math.random() * possible.length)]; }
        const randomTargetClicks = Math.floor(Math.random() * 100) + 1;
        selectDhikr(nextDhikr);
        remainingClicks = randomTargetClicks;
        disableAutoSwitch = true;
    }
    function toggleDarkMode() { isDarkMode = !isDarkMode; body.classList.toggle('dark-mode', isDarkMode); updateDarkModeIcon(); saveDataToStorage(); }
    function updateDarkModeIcon() { const icon = darkModeToggle.querySelector('i'); icon.className = isDarkMode ? 'fas fa-sun' : 'fas fa-moon'; darkModeToggle.title = isDarkMode ? 'الوضع الفاتح' : 'الوضع الداكن'; }
    
    document.addEventListener('keydown', (event) => {
        if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA' || dropdownOpen) return;
        if (event.code === 'Space' || event.key === 'Enter') { event.preventDefault(); incrementCounter(); }
        else if (event.key === 'Backspace') { event.preventDefault(); decrementCounter(); }
    });
  </script>
</body>
</html>
